services:
  db:
    image: postgres:15
    container_name: sentiment-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentimentdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"

  app:
    image: adrianfvr999/sentiment-app:latest
    container_name: sentiment-app
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: sentimentdb
      DB_USER: admin
      DB_PASSWORD: password123
    ports:
      - "5000:5000"
    depends_on:
      - db